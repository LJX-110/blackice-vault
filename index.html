<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050507">
<meta name="description" content="BLACKICE - personal encrypted terminal">
<title>黑冰匣 BLACKICE</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLACKICE">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<div id="crt" aria-hidden="true"></div>
<div id="amb" aria-hidden="true"></div>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="hud" aria-hidden="true"><div class="hud-x"></div><div class="hud-y"></div><div class="hud-pos">X:0000 Y:0000</div></div>

<div id="lock-screen" class="lock-screen">
  <div class="lock-card">
    <div class="lock-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
        <rect x="3" y="9" width="18" height="11" rx="2"/>
        <path d="M7 9V7a5 5 0 0 1 10 0v2"/>
        <circle cx="12" cy="14" r="1.8"/>
      </svg>
    </div>
    <h1 class="glitch" data-text="黑冰匣">黑冰匣</h1>
    <p class="subtitle">BLACKICE TERMINAL // PERSONAL SECURE VAULT</p>
    <p id="lock-hint" class="hint"></p>
    <form id="lock-form">
      <div class="password-wrap">
        <input type="password" id="lock-password" autocomplete="new-password" placeholder="主密码">
        <button type="button" class="icon-btn" data-toggle="lock-password" title="显示密码">
          <svg class="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="i-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <div id="lock-confirm-wrap" class="password-wrap hidden">
        <input type="password" id="lock-confirm" autocomplete="new-password" placeholder="确认主密码">
      </div>
      <button type="submit" id="lock-btn" class="btn btn-primary btn-block">UNLOCK</button>
      <p id="lock-error" class="error hidden"></p>
    </form>
  </div>
</div>

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="side-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <rect x="3" y="8" width="18" height="12" rx="2"/>
        <path d="M7 8V6a5 5 0 0 1 10 0v2"/>
        <circle cx="12" cy="14" r="1.8"/>
      </svg>
      <span class="brand-name glitch" data-text="黑冰匣">黑冰匣</span>
      <span class="brand-sub">//VAULT.SYS</span>
    </div>

    <nav class="side-nav" aria-label="保险库">
      <p class="nav-label">/// 保险库</p>
      <button type="button" class="nav-item active" data-view="all" data-text="全部条目">全部条目<span class="nc" id="c-all">0</span></button>
      <button type="button" class="nav-item" data-view="api" data-text="API">API<span class="nc" id="c-api">0</span></button>
      <button type="button" class="nav-item" data-view="account" data-text="账号">账号<span class="nc" id="c-account">0</span></button>
      <button type="button" class="nav-item" data-view="note" data-text="安全笔记">安全笔记<span class="nc" id="c-note">0</span></button>

      <p class="nav-label">/// 系统</p>
      <button type="button" class="nav-item" id="nav-security" data-text="安全设置">安全设置</button>
      <button type="button" class="nav-item" id="nav-backup" data-text="数据备份">数据备份</button>
      <button type="button" class="nav-item" id="nav-settings" data-text="偏好设置">偏好设置</button>

      <p class="nav-label">/// 会话</p>
      <button type="button" class="nav-item" id="sound-toggle-btn" data-text="音效：开">音效：开</button>
      <button type="button" class="nav-item" id="lock-btn-top" data-text="锁定保险库 [L]">锁定保险库 [L]</button>
    </nav>

    <div class="side-foot">
      <span>AES-256-GCM</span><span class="fs">·</span><span>PBKDF2-SHA256</span><span class="fs">·</span><span>LOCAL ONLY</span>
    </div>
  </aside>

  <div class="workspace">
    <header class="ws-bar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="搜索标题 / 字段 / 标签 / 内容…" autocomplete="off" aria-label="全局搜索">
        <kbd class="kbd-hint">CTRL K</kbd>
      </div>
      <span id="count" class="count" aria-live="polite"></span>
      <button type="button" id="layout-btn" class="btn btn-ghost" title="切换布局模式">布局：自动</button>
      <button type="button" id="add-btn" class="btn btn-primary">＋ 新增条目</button>
    </header>

    <main class="layout">
      <section id="entry-list" class="entry-list" aria-label="条目列表">
        <div id="empty-state" class="empty hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="40" height="40">
            <rect x="3" y="8" width="18" height="12" rx="2"/>
            <path d="M7 8V6a5 5 0 0 1 10 0v2"/>
            <circle cx="12" cy="14" r="1.8"/>
          </svg>
          <p id="empty-text"></p>
        </div>
      </section>
      <section id="detail-panel" class="detail-panel" aria-label="详情面板"></section>
    </main>
  </div>
</div>

<div id="entry-modal" class="modal-backdrop hidden">
  <div class="modal modal-wide m-yellow" role="dialog" aria-modal="true" aria-labelledby="entry-modal-title">
    <h2 id="entry-modal-title">新增条目</h2>
    <form id="entry-form" novalidate>
      <div class="field" id="entry-type-wrap">
        <span class="field-label">类型 <span class="required">*</span></span>
        <div id="e-type" class="seg" role="radiogroup" aria-label="类型">
          <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-val="api">API</button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="account">账号</button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="note">安全笔记</button>
        </div>
      </div>
      <div class="field">
        <label for="e-title">标题 <span class="required">*</span></label>
        <input type="text" id="e-title" autocomplete="off" placeholder="如：OpenAI / GitHub 主账号 / 部署记录">
      </div>
      <div class="field">
        <label for="e-tags">标签</label>
        <input type="text" id="e-tags" autocomplete="off" placeholder="逗号分隔，如：主力, 生产环境">
      </div>
      <div id="entry-fields"></div>
      <div class="field" id="entry-desc-wrap">
        <label for="e-desc">备注</label>
        <textarea id="e-desc" rows="2" placeholder="选填"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="entry-modal">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="security-modal" class="modal-backdrop hidden">
  <div class="modal m-red" role="dialog" aria-modal="true" aria-labelledby="security-title">
    <h2 id="security-title">安全设置</h2>
    <form id="pwd-form">
      <div class="field">
        <label for="p-old">当前主密码</label>
        <div class="password-wrap">
          <input type="password" id="p-old" autocomplete="current-password" placeholder="当前主密码">
          <button type="button" class="icon-btn" data-toggle="p-old" title="显示密码">
            <svg class="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="p-new">新密码（至少 8 位）</label>
        <div class="password-wrap">
          <input type="password" id="p-new" autocomplete="new-password" placeholder="新主密码">
          <button type="button" class="icon-btn" data-toggle="p-new" title="显示密码">
            <svg class="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="p-confirm">确认新密码</label>
        <div class="password-wrap">
          <input type="password" id="p-confirm" autocomplete="new-password" placeholder="再次输入新主密码">
          <button type="button" class="icon-btn" data-toggle="p-confirm" title="显示密码">
            <svg class="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="security-modal">取消</button>
        <button type="submit" class="btn btn-primary">确认修改</button>
      </div>
    </form>
  </div>
</div>

<div id="backup-modal" class="modal-backdrop hidden">
  <div class="modal m-yellow" role="dialog" aria-modal="true" aria-labelledby="backup-title">
    <h2 id="backup-title">数据备份</h2>
    <div class="backup-actions">
      <button type="button" id="export-btn" class="btn btn-ghost">导出加密备份</button>
      <label class="btn btn-ghost import-label">
        导入备份
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </label>
    </div>
    <p class="hint-text">备份文件为密文，仅可用备份库的主密码解密。导入会覆盖当前全部数据并锁定应用。</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close="backup-modal">关闭</button>
    </div>
  </div>
</div>

<div id="settings-modal" class="modal-backdrop hidden">
  <div class="modal m-blue" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">偏好设置</h2>
    <div class="field">
      <span class="field-label">自动锁屏</span>
      <div id="auto-lock" class="seg" role="radiogroup" aria-label="自动锁屏">
        <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-val="0">不锁</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="5">5 分</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="15">15 分</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="30">30 分</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">音效</span>
      <div id="set-sound" class="seg" role="radiogroup" aria-label="音效">
        <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-val="on">开启</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="off">关闭</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">终端环境嗡鸣</span>
      <div id="set-hum" class="seg" role="radiogroup" aria-label="终端环境嗡鸣">
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="on">开启</button>
        <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-val="off">关闭</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">布局模式</span>
      <div id="set-layout" class="seg" role="radiogroup" aria-label="布局模式">
        <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-val="auto">自动</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="desktop">桌面</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="mobile">移动</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">环境动效</span>
      <div id="set-fx" class="seg" role="radiogroup" aria-label="环境动效">
        <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-val="on">开启</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="off">关闭</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">数据雨（红色）</span>
      <div id="set-rain" class="seg" role="radiogroup" aria-label="数据雨">
        <button type="button" class="seg-btn on" role="radio" aria-checked="true" data-val="on">开启</button>
        <button type="button" class="seg-btn" role="radio" aria-checked="false" data-val="off">关闭</button>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close="settings-modal">关闭</button>
    </div>
  </div>
</div>

<div id="confirm-modal" class="modal-backdrop hidden">
  <div class="modal m-red" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title">确认</h2>
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">取消</button>
      <button type="button" class="btn btn-ghost hidden" id="confirm-alt">合并导入</button>
      <button type="button" class="btn btn-primary" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<div id="palette-backdrop" class="palette-backdrop hidden">
  <div class="palette" role="dialog" aria-modal="true" aria-label="命令面板">
    <input type="text" id="pal-input" placeholder="输入命令或搜索条目…" autocomplete="off">
    <div id="pal-list" class="pal-list"></div>
  </div>
</div>

<div id="boot-screen" class="hidden">
  <pre id="boot-lines" aria-live="polite"></pre>
</div>

<div id="toast" class="toast hidden"></div>

<script>
window.addEventListener('error', function (ev) {
  var h = document.getElementById('lock-hint');
  if (h) h.textContent = '加载异常：' + (ev.message || '资源加载失败') + ' —— 当前访问地址：' + location.origin + '；请确认三个 js 文件为同一新版本，然后 Ctrl+F5 强刷（数据与访问地址绑定，换地址=空库）';
}, true);
window.addEventListener('DOMContentLoaded', function () {
  if (location.protocol === 'file:') {
    var h = document.getElementById('lock-hint');
    if (h) h.textContent = '请通过 HTTPS（如 GitHub Pages）或本地服务器访问本终端，双击打开的 file:// 无法加载模块。';
    return;
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
});
</script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
